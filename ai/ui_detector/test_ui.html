<!DOCTYPE html>
<html>
<head>
    <title>NETRA UI Test</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 40px;
        }

        .card {
            width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            padding: 12px 30px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Registration Form</h1>

    <label>Name</label>
    <input type="text">

    <label>Email</label>
    <input type="text">

    <label>Phone</label>
    <input type="text">

    <button>Submit</button>

</div>

</body>
</html>
